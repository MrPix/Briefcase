name: Docker Publish

on:
  workflow_call:
    inputs:
      tags:
        required: false
        type: string
        default: ''
      build_args:
        required: false
        type: string
        default: ''
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: briefcase-api
            dockerfile: src/Briefcase.ApiService/Dockerfile
          - service: briefcase-web
            dockerfile: src/Briefcase.Web/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Prepare build configuration
        id: config
        run: |
          if [ "${{ github.event_name }}" = "workflow_call" ]; then
            {
              echo 'tags<<EOF'
              printf '%s\n' '${{ inputs.tags }}'
              echo 'EOF'
              echo 'build_args<<EOF'
              printf '%s\n' '${{ inputs.build_args }}'
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo 'tags<<EOF'
              echo 'type=sha'
              echo 'type=raw,value=edge,enable={{is_default_branch}}'
              echo 'EOF'
              echo 'build_args<<EOF'
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          tags: ${{ steps.config.outputs.tags }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.config.outputs.build_args }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
