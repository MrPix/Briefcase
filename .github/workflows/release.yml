name: Release

on:
  release:
    types: [published]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write

    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      build_number: ${{ steps.version.outputs.BUILD_NUMBER }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install .NET MAUI Android Workload
        run: dotnet workload install maui-android

      - name: Restore dependencies
        run: dotnet restore Briefcase.slnx

      - name: Build
        run: |
          dotnet build Briefcase.slnx \
            --no-restore \
            --configuration Release \
            /p:Version=${{ steps.version.outputs.VERSION }} \
            /p:BuildNumber=${{ steps.version.outputs.BUILD_NUMBER }}

      - name: Run unit tests
        run: |
          dotnet test tests/Briefcase.UnitTests/Briefcase.UnitTests.csproj \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=test-results.trx"

      - name: Run integration tests
        run: |
          dotnet test tests/Briefcase.IntegrationTests/Briefcase.IntegrationTests.csproj \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=integration-test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/*test-results.trx"

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Test Results
          path: "**/*test-results.trx"
          reporter: dotnet-trx

  docker-publish:
    needs: build-and-test
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      tags: |
        type=raw,value=${{ needs.build-and-test.outputs.version }}
        type=raw,value=${{ needs.build-and-test.outputs.version }}-${{ needs.build-and-test.outputs.build_number }}
        type=raw,value=latest
      build_args: |
        VERSION=${{ needs.build-and-test.outputs.version }}
        BUILD_NUMBER=${{ needs.build-and-test.outputs.build_number }}
    secrets: inherit
