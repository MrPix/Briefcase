<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Briefcase</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="Briefcase.Web.styles.css" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="alternate icon" type="image/png" href="favicon.png" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script src="e2ee.js"></script>
    <script>
        // Register the service worker and automatically apply new deployments.
        // When a redeploy is detected the new worker is activated right away and
        // the page reloads once, so users never need "Clear cache and hard reload".
        if ('serviceWorker' in navigator) {
            let refreshing = false;

            // Reload exactly once when the new worker takes control of the page.
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (refreshing) return;
                refreshing = true;
                window.location.reload();
            });

            navigator.serviceWorker.register('service-worker.js').then(registration => {
                // When an updated worker finishes installing, tell it to activate
                // immediately (only if the page is already controlled, i.e. this is
                // an update and not the very first install).
                registration.addEventListener('updatefound', () => {
                    const newWorker = registration.installing;
                    if (!newWorker) return;
                    newWorker.addEventListener('statechange', () => {
                        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            newWorker.postMessage({ type: 'SKIP_WAITING' });
                        }
                    });
                });

                // Proactively check for a new deployment on load, when the tab
                // regains focus, and periodically while it stays open.
                registration.update();
                document.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'visible') registration.update();
                });
                setInterval(() => registration.update(), 60 * 1000);
            });
        }
    </script>
    <script>
        window.Briefcase = {
            scrollToBottom: function (element) {
                if (element) element.scrollTop = element.scrollHeight;
            },
            downloadFile: function (fileName, contentType, data) {
                var blob = new Blob([new Uint8Array(data)], { type: contentType });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
        };
    </script>
</body>

</html>
